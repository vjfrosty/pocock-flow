name: test
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly: catch upstream renames in mattpocock/skills
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mattpocock/skills
          path: upstream
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        env:
          UPSTREAM_DIR: ${{ github.workspace }}/upstream
